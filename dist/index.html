<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>品牌资讯 - Brand Pulse</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
      .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
      .header { text-align: center; padding: 40px 0 30px; }
      .header h1 { font-size: 2.5rem; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .header p { color: #94a3b8; margin-top: 8px; }
      .update-info { text-align: center; color: #64748b; font-size: 0.85rem; margin-bottom: 30px; }
      .brands-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
      .brand-card { background: #1e293b; border-radius: 16px; overflow: hidden; border: 1px solid #334155; }
      .brand-header { padding: 20px; display: flex; align-items: center; gap: 12px; }
      .brand-dot { width: 12px; height: 12px; border-radius: 50%; }
      .brand-name { font-size: 1.3rem; font-weight: 700; }
      .brand-count { margin-left: auto; color: #64748b; font-size: 0.85rem; }
      .news-list { padding: 0 16px 16px; max-height: 400px; overflow-y: auto; }
      .news-item { padding: 12px 0; border-top: 1px solid #334155; }
      .news-item:first-child { border-top: none; }
      .news-title { color: #e2e8f0; text-decoration: none; font-size: 0.9rem; line-height: 1.5; display: block; }
      .news-title:hover { color: #60a5fa; }
      .news-meta { color: #64748b; font-size: 0.75rem; margin-top: 4px; }
      .loading { text-align: center; padding: 60px; color: #64748b; }
      .error { text-align: center; padding: 40px; color: #f87171; }
    </style>
    <script type="module" crossorigin src="/assets/index-CUkgnqVc.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
